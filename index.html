<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Almas Game</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
canvas{display:block}
#msg{position:fixed;left:12px;top:12px;color:#fff;font:14px system-ui;z-index:2}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<div id="msg">Карта мен кейіпкер жүктелуде…</div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const MAP_URL='./sendstone_new.glb';
const PLAYER_URL='./sas__cs2_agent_model_blue.glb';

const msg=document.getElementById('msg');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x222222);

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.001,1000);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5);
scene.add(sun);

const loader=new GLTFLoader();
let player=null;
let playerHeight=0.05;

function getFloorY(map,x,z){
  const box=new THREE.Box3().setFromObject(map);
  const height=Math.max(box.max.y-box.min.y,0.1);
  const ray=new THREE.Raycaster(
    new THREE.Vector3(x,box.max.y+height*4,z),
    new THREE.Vector3(0,-1,0),
    0,
    height*10
  );

  const hits=ray.intersectObject(map,true);
  let best=null;

  for(const hit of hits){
    if(!hit.face) continue;

    const normalMatrix=new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
    const normal=hit.face.normal.clone().applyMatrix3(normalMatrix).normalize();

    if(normal.y>0.35 && (best===null || hit.point.y>best)){
      best=hit.point.y;
    }
  }

  return best===null ? box.min.y : best;
}

function setThirdPersonCamera(){
  if(!player) return;

  const target=new THREE.Vector3(
    player.position.x,
    player.position.y+playerHeight*0.72,
    player.position.z
  );

  camera.position.set(
    player.position.x,
    player.position.y+playerHeight*1.45,
    player.position.z+playerHeight*4.2
  );

  camera.lookAt(target);
}

async function start(){
  try{
    msg.textContent='Карта жүктелуде…';
    const mapGltf=await loader.loadAsync(MAP_URL);
    const map=mapGltf.scene;
    scene.add(map);

    const mapBox=new THREE.Box3().setFromObject(map);
    const mapCenter=mapBox.getCenter(new THREE.Vector3());

    msg.textContent='Кейіпкер жүктелуде…';
    const playerGltf=await loader.loadAsync(PLAYER_URL);
    player=playerGltf.scene;

    player.rotation.z=Math.PI/2;
    player.updateMatrixWorld(true);

    let pBox=new THREE.Box3().setFromObject(player);
    playerHeight=pBox.getSize(new THREE.Vector3()).y || 0.05;

    const pCenter=pBox.getCenter(new THREE.Vector3());
    player.position.x+=mapCenter.x-pCenter.x;
    player.position.z+=mapCenter.z-pCenter.z;
    player.updateMatrixWorld(true);

    pBox=new THREE.Box3().setFromObject(player);
    const floorY=getFloorY(map,player.position.x,player.position.z);
    player.position.y+=floorY-pBox.min.y;
    player.updateMatrixWorld(true);

    scene.add(player);

    pBox=new THREE.Box3().setFromObject(player);
    playerHeight=pBox.getSize(new THREE.Vector3()).y || playerHeight;

    camera.near=Math.max(playerHeight*0.02,0.0005);
    camera.far=Math.max(100,mapBox.getSize(new THREE.Vector3()).length()*20);
    camera.updateProjectionMatrix();

    setThirdPersonCamera();
    msg.style.display='none';
  }catch(error){
    console.error(error);
    msg.textContent='Жүктеу қатесі';
  }
}

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

renderer.setAnimationLoop(()=>{
  if(player) setThirdPersonCamera();
  renderer.render(scene,camera);
});

start();
</script>
</body>
</html>
