<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sendstone_new</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111}
canvas{display:block}
#msg{position:fixed;left:12px;top:12px;color:#fff;font:14px system-ui;z-index:2}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<div id="msg">sendstone_new.glb жүктелуде…</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const msg=document.getElementById('msg');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x222222);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.01,10000);
camera.position.set(3,2,3);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(5,10,5); scene.add(sun);

new GLTFLoader().load('./sendstone_new.glb',g=>{
  scene.add(g.scene);
  const box=new THREE.Box3().setFromObject(g.scene);
  const size=box.getSize(new THREE.Vector3());
  const center=box.getCenter(new THREE.Vector3());
  const m=Math.max(size.x,size.y,size.z)||1;
  camera.position.set(center.x+m,center.y+m*0.7,center.z+m);
  controls.target.copy(center);
  controls.update();
  msg.style.display='none';
},undefined,e=>{
  console.error(e);
  msg.textContent='sendstone_new.glb табылмады';
});

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body>
</html>
